name: Motorola UI Port Builder (Infinity-X / lemonades)

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: 'Git clone URL for the Motorola lhotse dump repository'
        required: true
        default: 'https://dumps.tadiphone.dev/dumps/motorola/lhotse.git'
        type: string
      source_ref:
        description: 'Motorola Android 17 dump branch'
        required: true
        default: 'user-17-VWL35HV-19-ST9.2-8c0861-release-keys'
        type: string
      components:
        description: 'Which UI candidates to collect'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - launcher
          - widgets
          - lockscreen
      include_wallpaper:
        description: 'Also collect wallpaper / live-wallpaper / depth-effect candidates'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: motorola-ui-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-port-candidates:
    name: Extract, inspect and package candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_REPO_URL: ${{ inputs.source_repo_url }}
      SOURCE_REF: ${{ inputs.source_ref }}
      COMPONENTS: ${{ inputs.components }}
      INCLUDE_WALLPAPER: ${{ inputs.include_wallpaper }}
      TARGET_DEVICE: OnePlus 9R (lemonades / SM8250)
      TARGET_ROM: Infinity-X Android 17

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'build-tools;36.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Fetch Motorola dump branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPO_URL" || -z "$SOURCE_REF" ]]; then
            echo 'ERROR: source repository URL and branch are required.' >&2
            exit 2
          fi

          # Partial clone reduces transfer when the hosting server supports it.
          if ! git clone --depth 1 --filter=blob:none --no-checkout \
              --branch "$SOURCE_REF" "$SOURCE_REPO_URL" motorola-dump; then
            echo 'ERROR: Could not clone the dump URL/branch.' >&2
            echo 'Verify that the dump host exposes a Git clone endpoint and that the branch name is exact.' >&2
            exit 1
          fi

          cd motorola-dump
          git sparse-checkout init --cone
          git sparse-checkout set system product system_ext vendor odm
          if ! git checkout "$SOURCE_REF"; then
            echo 'ERROR: Branch checkout failed. Check the dump tree layout and branch name.' >&2
            exit 1
          fi

          echo "Source URL: $SOURCE_REPO_URL" > ../source-info.txt
          echo "Source ref: $SOURCE_REF" >> ../source-info.txt
          echo "Source commit: $(git rev-parse HEAD)" >> ../source-info.txt
          echo "Target device: $TARGET_DEVICE" >> ../source-info.txt
          echo "Target ROM: $TARGET_ROM" >> ../source-info.txt

      - name: Inventory APKs and select UI candidates
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          DUMP="$GITHUB_WORKSPACE/motorola-dump"
          OUT="$GITHUB_WORKSPACE/work"
          mkdir -p "$OUT/candidates" "$OUT/module" "$OUT/reports"
          cp source-info.txt "$OUT/reports/source-info.txt"

          INVENTORY="$OUT/reports/all-apk-inventory.tsv"
          SELECTED="$OUT/reports/selected-candidates.tsv"
          printf 'source_path\tsize_bytes\tsha256\n' > "$INVENTORY"
          printf 'component\tsource_path\tmodule_path\n' > "$SELECTED"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo 'ERROR: aapt was not found after Android SDK setup.' >&2
            exit 1
          fi
          echo "$AAPT" > "$OUT/reports/aapt-path.txt"

          count_all=0
          count_selected=0
          count_launcher=0
          count_widgets=0
          count_lockscreen=0
          count_wallpaper=0

          classify() {
            local p="${1,,}"
            # Prefer directory/package names as well as APK filenames; dumps often use base.apk.
            if [[ "$p" =~ launcher|quickstep|launcher3|smartspace ]]; then
              echo launcher
            elif [[ "$p" =~ widget|weather|moto.?clock|calendarwidget ]]; then
              echo widgets
            elif [[ "$p" =~ keyguard|lockscreen|lock_screen|motosignature|moto.?display|peekdisplay|attentive.?display|ambientdisplay ]]; then
              echo lockscreen
            elif [[ "$INCLUDE_WALLPAPER" == 'true' && "$p" =~ wallpaper|livewallpaper|depth.?effect ]]; then
              echo wallpaper
            else
              echo ''
            fi
          }

          while IFS= read -r -d '' apk; do
            rel="${apk#"$DUMP"/}"
            size="$(stat -c '%s' "$apk")"
            hash="$(sha256sum "$apk" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$rel" "$size" "$hash" >> "$INVENTORY"
            count_all=$((count_all + 1))

            category="$(classify "$rel")"
            [[ -n "$category" ]] || continue
            if [[ "$COMPONENTS" != 'all' && "$COMPONENTS" != "$category" ]]; then
              # Wallpaper candidates are opt-in and only included when components=all.
              continue
            fi
            [[ "$category" != wallpaper || "$INCLUDE_WALLPAPER" == 'true' ]] || continue

            # Candidate bundle preserves the exact path from the dump for traceability.
            mkdir -p "$OUT/candidates/$(dirname "$rel")"
            cp -p "$apk" "$OUT/candidates/$rel"

            # Magisk/KernelSU-compatible module convention: files are overlaid under system/.
            # Product/system_ext/vendor/odm keep their partition-relative locations beneath system/.
            case "$rel" in
              # system paths are already in the module's expected system/ tree.
              system/*)      module_rel="$rel" ;;
              # Other Android partitions are represented below system/ for the
              # standard Magisk/KernelSU module overlay layout.
              product/*)    module_rel="system/$rel" ;;
              system_ext/*) module_rel="system/$rel" ;;
              vendor/*)     module_rel="system/$rel" ;;
              odm/*)        module_rel="system/$rel" ;;
              *)            continue ;;
            esac

            mkdir -p "$OUT/module/$(dirname "$module_rel")"
            cp -p "$apk" "$OUT/module/$module_rel"
            printf '%s\t%s\t%s\n' "$category" "$rel" "$module_rel" >> "$SELECTED"
            count_selected=$((count_selected + 1))
            case "$category" in
              launcher) count_launcher=$((count_launcher + 1)) ;;
              widgets) count_widgets=$((count_widgets + 1)) ;;
              lockscreen) count_lockscreen=$((count_lockscreen + 1)) ;;
              wallpaper) count_wallpaper=$((count_wallpaper + 1)) ;;
            esac
          done < <(find "$DUMP/system" "$DUMP/product" "$DUMP/system_ext" "$DUMP/vendor" "$DUMP/odm" \
                    -type f -iname '*.apk' -print0 2>/dev/null || true)

          {
            echo "All APKs inventoried: $count_all"
            echo "Selected APK candidates: $count_selected"
            echo "Launcher: $count_launcher"
            echo "Widgets/weather/clock: $count_widgets"
            echo "Lockscreen/Keyguard/Moto Display: $count_lockscreen"
            echo "Wallpaper/depth effect: $count_wallpaper"
            echo
            echo 'IMPORTANT: Selection is heuristic based on file/directory names. It does not prove that an APK is a required component or compatible with the target ROM.'
          } > "$OUT/reports/summary.txt"

          {
            echo "all_apks=$count_all"
            echo "selected=$count_selected"
            echo "launcher=$count_launcher"
            echo "widgets=$count_widgets"
            echo "lockscreen=$count_lockscreen"
            echo "wallpaper=$count_wallpaper"
          } >> "$GITHUB_OUTPUT"

      - name: Extract APK manifest metadata
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/work"
          REPORT="$OUT/reports/candidate-manifest-metadata.txt"
          AAPT="$(cat "$OUT/reports/aapt-path.txt" 2>/dev/null || true)"
          : > "$REPORT"
          if [[ -z "$AAPT" || ! -x "$AAPT" ]]; then
            echo 'aapt unavailable; manifest metadata could not be generated.' > "$REPORT"
            exit 0
          fi

          while IFS= read -r -d '' apk; do
            rel="${apk#"$OUT/candidates"/}"
            {
              echo '============================================================'
              echo "Source path: $rel"
              echo 'Package / SDK / launchable activity / permissions / libraries:'
              "$AAPT" dump badging "$apk" 2>&1 \
                | grep -E '^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:|uses-permission:|uses-library:|uses-feature:|native-code:)' \
                || true
              echo
            } >> "$REPORT"
          done < <(find "$OUT/candidates" -type f -iname '*.apk' -print0 2>/dev/null)

      - name: Write module metadata and safety notes
        if: steps.collect.outputs.selected != '0'
        shell: bash
        run: |
          set -euo pipefail
          MODULE="$GITHUB_WORKSPACE/work/module"
          cat > "$MODULE/module.prop" <<EOF
          id=motorola_ui_candidates_infinityx
          name=Motorola UI Candidates (Infinity-X Android 17)
          version=0.1.${GITHUB_RUN_NUMBER}
          versionCode=${GITHUB_RUN_NUMBER}
          author=Community porting workflow
          description=Experimental Motorola UI APK candidates for OnePlus 9R lemonades
          EOF

          cat > "$MODULE/PORTING_STATUS.txt" <<EOF
          EXPERIMENTAL CANDIDATE MODULE - NOT A VERIFIED PORT
          Target ROM: Infinity-X Android 17
          Target device: OnePlus 9R (lemonades / SM8250)
          Source branch: ${SOURCE_REF}

          This module overlays APKs selected by filename/path heuristics from the Motorola lhotse dump.
          It does not patch framework-res, SystemUI, PackageManager, privapp-permissions, overlays,
          signatures, hidden API restrictions, or Motorola proprietary services.

          Do not install on a daily-driver build without a full backup and a recovery path.
          Some candidates may be incomplete, unrelated, incompatible, or conflict with existing packages.
          A lockscreen APK alone is not a lockscreen port. Motorola Keyguard/SystemUI integration may
          require framework patches and matching vendor services.

          Install through a compatible KernelSU/Magisk module manager only. This ZIP is not a recovery
          flashable OTA package. Disable/remove the module from recovery if Android fails to boot.
          EOF

          cp "$GITHUB_WORKSPACE/work/reports/selected-candidates.tsv" "$MODULE/SELECTED-CANDIDATES.tsv"

      - name: Create candidate and module ZIPs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/work"
          if [[ -d candidates ]]; then
            zip -qr motorola-ui-candidates.zip candidates
          fi
          if [[ -f module/module.prop ]]; then
            (cd module && zip -qr ../motorola-ui-candidate-module.zip .)
          fi
          zip -qr motorola-port-reports.zip reports

      - name: Upload candidate APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motorola-ui-apk-candidates
          path: work/motorola-ui-candidates.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload experimental KernelSU/Magisk module
        if: steps.collect.outputs.selected != '0'
        uses: actions/upload-artifact@v4
        with:
          name: motorola-ui-candidate-module-infinityx-android17-lemonades
          path: work/motorola-ui-candidate-module.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload porting reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motorola-ui-port-reports
          path: work/motorola-port-reports.zip
          if-no-files-found: error
          retention-days: 14

      - name: Fail with helpful message if no candidates were found
        if: steps.collect.outputs.selected == '0'
        run: |
          echo 'No candidates matched the selected heuristics. Review the APK inventory and update the patterns for the dump layout.'
          exit 1
